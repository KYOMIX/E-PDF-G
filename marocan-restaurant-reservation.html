    <style>
        :root {
            --primary-gold: #c9a227;
            --light-gold: #e8d5a3;
            --dark-gold: #a0822a;
            --deep-emerald: #0d3328;
            --rich-burgundy: #6b1a1a;
            --warm-cream: #faf6ed;
            --soft-ivory: #f5f0e6;
            --charcoal: #1a1a1a;
            --warm-gray: #6b6560;
            --glass-white: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--deep-emerald);
            min-height: 100vh;
            color: var(--charcoal);
            line-height: 1.7;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(201, 162, 39, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(107, 26, 26, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(201, 162, 39, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a227' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 720px;
            margin: 40px auto;
            background: var(--glass-white);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            position: relative;
            z-index: 1;
            animation: containerReveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes containerReveal {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .header {
            background: linear-gradient(135deg, var(--deep-emerald) 0%, #1a4a3a 50%, var(--deep-emerald) 100%);
            color: white;
            padding: 50px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(201, 162, 39, 0.15) 0%, transparent 70%);
            animation: headerGlow 8s ease-in-out infinite;
        }

        @keyframes headerGlow {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-gold), var(--light-gold), var(--primary-gold), transparent);
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .header-icon {
            font-size: 2.5rem;
            color: var(--light-gold);
            margin-bottom: 16px;
            display: inline-block;
            animation: iconFloat 4s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .header h2 {
            margin: 0;
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--light-gold);
            text-shadow: 0 2px 20px rgba(201, 162, 39, 0.3);
            position: relative;
        }

        .header h2::after {
            content: '';
            display: block;
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-gold), transparent);
            margin: 16px auto 0;
        }

        .header p {
            margin: 16px 0 0;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.3rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 2px;
        }

        .form-content {
            padding: 45px 40px;
        }

        .form-group {
            margin-bottom: 28px;
            position: relative;
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }
        .form-group:nth-child(5) { animation-delay: 0.5s; }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            color: var(--deep-emerald);
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
        }

        label i {
            margin-right: 10px;
            color: var(--primary-gold);
            width: 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        input[type="date"],
        input[type="text"],
        input[type="number"],
        input[type="file"],
        textarea {
            width: 100%;
            padding: 16px 18px;
            border: 2px solid rgba(201, 162, 39, 0.15);
            border-radius: 14px;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            background: rgba(255, 255, 255, 0.9);
            color: var(--charcoal);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        input[type="date"]:hover,
        input[type="text"]:hover,
        input[type="number"]:hover,
        textarea:hover {
            border-color: rgba(201, 162, 39, 0.4);
            box-shadow: 0 4px 16px rgba(201, 162, 39, 0.08);
        }

        input[type="date"]:focus,
        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="file"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-gold);
            box-shadow: 0 0 0 4px rgba(201, 162, 39, 0.12), 0 4px 20px rgba(201, 162, 39, 0.1);
            background: white;
            transform: translateY(-2px);
        }

        input[type="number"][min="0"] {
            width: 80px;
            text-align: center;
            display: inline-block;
            margin-left: 12px;
            font-weight: 600;
            font-size: 1rem;
            padding: 12px;
        }

        input[type="file"] {
            padding: 14px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--warm-gray);
        }

        input[type="file"]::file-selector-button {
            background: linear-gradient(135deg, var(--primary-gold), var(--dark-gold));
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-right: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(201, 162, 39, 0.25);
        }

        input[type="file"]::file-selector-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(201, 162, 39, 0.35);
        }

        .menu-section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--deep-emerald);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-section-title::before,
        .menu-section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--primary-gold), transparent);
        }

        .menu-section-title::after {
            background: linear-gradient(90deg, transparent, var(--primary-gold));
        }

        .menu-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 22px;
            background: linear-gradient(135deg, rgba(250, 246, 237, 0.9) 0%, rgba(255, 255, 255, 0.7) 100%);
            border-radius: 16px;
            margin-bottom: 12px;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            border: 1px solid rgba(201, 162, 39, 0.1);
            position: relative;
            overflow: hidden;
        }

        .menu-option::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--primary-gold), var(--dark-gold));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .menu-option:hover {
            background: linear-gradient(135deg, rgba(201, 162, 39, 0.08) 0%, rgba(255, 255, 255, 0.9) 100%);
            border-color: rgba(201, 162, 39, 0.25);
            transform: translateX(6px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        .menu-option:hover::before {
            opacity: 1;
        }

        .menu-option label {
            margin-bottom: 0;
            flex-grow: 1;
            cursor: pointer;
            font-weight: 500;
            text-transform: none;
            letter-spacing: 0.5px;
            font-size: 0.95rem;
            color: var(--charcoal);
            position: relative;
            z-index: 1;
        }

        .menu-price {
            color: var(--rich-burgundy);
            font-weight: 700;
            margin-right: 16px;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            font-family: 'Cormorant Garamond', serif;
            position: relative;
            z-index: 1;
        }

        .menu-option input[type="number"] {
            position: relative;
            z-index: 2;
            border-radius: 10px;
            border: 2px solid rgba(201, 162, 39, 0.2);
        }

        .menu-option input[type="number"]:focus {
            border-color: var(--primary-gold);
        }

        .total-display {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 500;
            margin: 35px 0;
            padding: 24px;
            background: linear-gradient(135deg, rgba(201, 162, 39, 0.08) 0%, rgba(250, 246, 237, 0.6) 100%);
            border-radius: 18px;
            border: 1px solid rgba(201, 162, 39, 0.2);
            position: relative;
            overflow: hidden;
            font-family: 'Cormorant Garamond', serif;
        }

        .total-display::before {
            content: '◆';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--primary-gold);
            font-size: 0.7rem;
            opacity: 0.5;
        }

        .total-amount {
            color: var(--rich-burgundy);
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            display: block;
            margin-top: 8px;
            font-family: 'Cormorant Garamond', serif;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 30px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 36px;
            background: linear-gradient(135deg, var(--primary-gold) 0%, var(--dark-gold) 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            text-align: center;
            width: 100%;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
            box-shadow: 0 6px 24px rgba(201, 162, 39, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: 0.6s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 36px rgba(201, 162, 39, 0.4);
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--deep-emerald) 0%, #1a4a3a 100%);
            box-shadow: 0 6px 24px rgba(13, 51, 40, 0.3);
        }

        .btn-secondary:hover {
            box-shadow: 0 12px 36px rgba(13, 51, 40, 0.4);
        }

        #downloadLink {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: var(--deep-emerald);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            padding: 18px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(201, 162, 39, 0.1) 0%, rgba(250, 246, 237, 0.5) 100%);
            border: 2px solid rgba(201, 162, 39, 0.25);
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #downloadLink:hover {
            color: var(--primary-gold);
            background: linear-gradient(135deg, rgba(201, 162, 39, 0.18) 0%, rgba(250, 246, 237, 0.7) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(201, 162, 39, 0.12);
            text-decoration: none;
        }

        #downloadLink i {
            margin-right: 10px;
            color: var(--primary-gold);
        }

        #output {
            width: 100%;
            height: 260px;
            margin-top: 20px;
            padding: 20px;
            border: 2px solid rgba(201, 162, 39, 0.12);
            border-radius: 14px;
            font-size: 0.9em;
            background: rgba(255, 255, 255, 0.7);
            resize: vertical;
            box-sizing: border-box;
            color: var(--charcoal);
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
            line-height: 1.6;
        }

        #output:focus {
            border-color: var(--primary-gold);
            background: white;
            box-shadow: 0 0 0 4px rgba(201, 162, 39, 0.1);
        }

        .logo-preview {
            width: 100px;
            height: 100px;
            border-radius: 16px;
            object-fit: cover;
            border: 3px solid var(--primary-gold);
            display: none;
            margin: 16px auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transition: all 0.4s ease;
        }

        .logo-preview.visible {
            display: block;
            animation: logoReveal 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes logoReveal {
            from {
                opacity: 0;
                transform: scale(0.8) rotate(-5deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }

        .section-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(201, 162, 39, 0.3), transparent);
            margin: 32px 0;
            position: relative;
        }

        .section-divider::after {
            content: '◆';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: var(--primary-gold);
            background: var(--glass-white);
            padding: 0 16px;
            font-size: 0.8rem;
        }

        .required-star {
            color: var(--rich-burgundy);
            margin-left: 4px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 16px;
            }

            .container {
                margin: 10px auto;
                border-radius: 20px;
            }

            .header {
                padding: 40px 24px;
            }

            .header h2 {
                font-size: 2.2rem;
                letter-spacing: 2px;
            }

            .header p {
                font-size: 1.1rem;
            }

            .form-content {
                padding: 32px 24px;
            }

            .menu-option {
                padding: 16px 18px;
                flex-wrap: wrap;
                gap: 12px;
            }

            .menu-option label {
                width: 100%;
                margin-bottom: 4px;
            }

            .menu-price {
                margin-right: auto;
            }

            input[type="number"][min="0"] {
                margin-left: auto;
            }

            .btn {
                padding: 16px 28px;
                font-size: 0.85rem;
            }

            .total-amount {
                font-size: 1.6rem;
            }
        }

        @media (max-width: 480px) {
            .header h2 {
                font-size: 1.8rem;
            }

            .header p {
                font-size: 1rem;
            }

            .form-content {
                padding: 28px 20px;
            }

            .menu-section-title {
                font-size: 1.2rem;
            }

            .total-display {
                padding: 20px;
            }

            .total-amount {
                font-size: 1.5rem;
            }
        }
    </style>

<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="header-icon">
                    <i class="fas fa-utensils"></i>
                </div>
                <h2>Réservation Premium</h2>
                <p>Restaurant « LE NARJIS » — 19H30</p>
            </div>
        </div>

        <div class="form-content">
            <div class="form-group">
                <label for="logo"><i class="fas fa-camera-retro"></i>Logo (pour PDF)</label>
                <input type="file" id="logo" accept="image/*">
                <img id="logoPreview" class="logo-preview" alt="Logo Preview">
            </div>

            <div class="section-divider"></div>

            <div class="form-group">
                <label for="date"><i class="far fa-calendar-alt"></i>Date<span class="required-star">*</span></label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group">
                <label for="name"><i class="far fa-user"></i>Nom / Name<span class="required-star">*</span></label>
                <input type="text" id="name" required placeholder="Nom du client">
            </div>

            <div class="form-group">
                <label for="room"><i class="fas fa-door-open"></i>N° de chambre / Room<span class="required-star">*</span></label>
                <input type="text" id="room" required placeholder="Numéro de chambre">
            </div>

            <div class="form-group">
                <label for="pax"><i class="fas fa-users"></i>Nombre de personnes : PAX<span class="required-star">*</span></label>
                <input type="number" id="pax" min="1" required placeholder="1">
            </div>

            <div class="section-divider"></div>

            <div class="form-group">
                <div class="menu-section-title">
                    <span>Menu Choices</span>
                </div>
                
                <div class="menu-option">
                    <label for="menu1">Menu Jardins d'Agadir</label>
                    <span class="menu-price">250 DH</span>
                    <input type="number" id="menu1" min="0" value="0">
                </div>
                
                <div class="menu-option">
                    <label for="menu2">Menu Pêcheur</label>
                    <span class="menu-price">250 DH</span>
                    <input type="number" id="menu2" min="0" value="0">
                </div>
                
                <div class="menu-option">
                    <label for="menu3">Menu Berbère</label>
                    <span class="menu-price">180 DH</span>
                    <input type="number" id="menu3" min="0" value="0">
                </div>
                
                <div class="menu-option">
                    <label for="menu4">Menu Narjis</label>
                    <span class="menu-price">150 DH</span>
                    <input type="number" id="menu4" min="0" value="0">
                </div>
            </div>

            <div id="totalDisplay" class="total-display">
                Total estimé
                <span id="totalAmount" class="total-amount">0 DH</span>
            </div>

            <div class="btn-group">
                <button class="btn" onclick="if(validateForm()) generateFile()">
                    <i class="fas fa-file-alt"></i> Générer le bon
                </button>
                <button class="btn btn-secondary" onclick="if(validateForm()) generatePDF()">
                    <i class="fas fa-file-pdf"></i> Générer PDF
                </button>
            </div>

            <a id="downloadLink" style="display:none;">
                <i class="fas fa-download"></i> Télécharger le bon (.txt)
            </a>

            <div class="section-divider"></div>

            <div class="form-group">
                <label for="output"><i class="fas fa-file-signature"></i>Résultat généré</label>
                <textarea id="output" readonly placeholder="Le contenu généré apparaîtra ici..."></textarea>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('date').min = new Date().toISOString().split('T')[0];

        document.getElementById('logo').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const logoPreview = document.getElementById('logoPreview');
                    logoPreview.src = event.target.result;
                    logoPreview.classList.add('visible');
                    localStorage.setItem('logoPreview', event.target.result);
                }
                reader.readAsDataURL(file);
            }
        });

        window.addEventListener('load', function() {
            const savedLogo = localStorage.getItem('logoPreview');
            if (savedLogo) {
                const logoPreview = document.getElementById('logoPreview');
                logoPreview.src = savedLogo;
                logoPreview.classList.add('visible');
            }
        });

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('change', function() {
                localStorage.setItem(this.id, this.value);
                calculateTotal();
            });
        });

        window.addEventListener('load', function() {
            document.querySelectorAll('input').forEach(input => {
                const savedValue = localStorage.getItem(input.id);
                if (savedValue) input.value = savedValue;
            });
            calculateTotal();
        });

        function calculateTotal() {
            const menu1 = parseInt(document.getElementById('menu1').value) || 0;
            const menu2 = parseInt(document.getElementById('menu2').value) || 0;
            const menu3 = parseInt(document.getElementById('menu3').value) || 0;
            const menu4 = parseInt(document.getElementById('menu4').value) || 0;
            
            const total = (menu1 * 250) + (menu2 * 250) + (menu3 * 180) + (menu4 * 150);
            document.getElementById('totalAmount').textContent = `${total} DH`;
        }

        function validateForm() {
            const date = document.getElementById('date').value;
            const name = document.getElementById('name').value;
            const room = document.getElementById('room').value;
            const pax = document.getElementById('pax').value;
            
            if (!date || !name || !room || !pax) {
                alert("Veuillez remplir tous les champs obligatoires");
                return false;
            }
            return true;
        }

        function generateFile() {
            if (!confirm("Confirmez les détails de votre réservation avant de générer le bon?")) {
                return;
            }

            const date = document.getElementById('date').value;
            const name = document.getElementById('name').value;
            const room = document.getElementById('room').value;
            const pax = document.getElementById('pax').value;

            const menu1 = parseInt(document.getElementById('menu1').value);
            const menu2 = parseInt(document.getElementById('menu2').value);
            const menu3 = parseInt(document.getElementById('menu3').value);
            const menu4 = parseInt(document.getElementById('menu4').value);

            let output = "╔════════════════════════════════╗\n";
            output += "║      BON DE RÉSERVATION       ║\n";
            output += "╚════════════════════════════════╝\n\n";
            output += `📅 Date: ${date}\n`;
            output += `👤 Nom/Name: ${name}\n`;
            output += `🚪 N° de chambre / ROOM: ${room}\n`;
            output += `👥 Nombre de personne: PAX ${pax}\n\n`;

            output += "🍽️ Restaurant « LE NARJIS » 19H30\n";
            output += "════════════════════════════════\n";
            if (menu1 > 0) output += `✓ ${menu1} x Menu Jardins d'Agadir\t\t250 DH\n`;
            if (menu2 > 0) output += `✓ ${menu2} x Menu Pêcheur\t\t\t250 DH\n`;
            if (menu3 > 0) output += `✓ ${menu3} x Menu Berbère\t\t\t180 DH\n`;
            if (menu4 > 0) output += `✓ ${menu4} x Menu Narjis\t\t\t150 DH\n\n`;

            output += "════════════════════════════════\n";
            output += "ℹ️ Réservation Client\n";
            output += "Les annulations sont acceptées jusqu'à 14h30 le jour prévu\n";
            output += "Cancellations are accepted until 2:30 PM on the scheduled day\n";
            output += "════════════════════════════════\n";

            document.getElementById('output').value = output;

            const blob = new Blob([output], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.getElementById('downloadLink');
            a.href = url;
            a.download = `Reservation_${name.replace(/\s+/g, '_')}_${formatDateForFilename(date)}.txt`;
            a.style.display = 'inline-block';
        }

        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('fr-FR', options);
        }

        function formatDateForFilename(dateString) {
            const date = new Date(dateString);
            return `${date.getFullYear()}${(date.getMonth()+1).toString().padStart(2, '0')}${date.getDate().toString().padStart(2, '0')}`;
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function generatePDF() {
            if (!confirm("Confirmez les détails de votre réservation avant de générer le PDF?")) {
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            const date = document.getElementById('date').value;
            const name = document.getElementById('name').value;
            const room = document.getElementById('room').value;
            const pax = document.getElementById('pax').value;
            const menu1 = parseInt(document.getElementById('menu1').value) || 0;
            const menu2 = parseInt(document.getElementById('menu2').value) || 0;
            const menu3 = parseInt(document.getElementById('menu3').value) || 0;
            const menu4 = parseInt(document.getElementById('menu4').value) || 0;
            const logoInput = document.getElementById('logo');
            
            const total = (menu1 * 250) + (menu2 * 250) + (menu3 * 180) + (menu4 * 150);
            
            doc.setDrawColor(212, 175, 55);
            doc.setFillColor(212, 175, 55);
            doc.rect(0, 0, 220, 30, 'F');
            
            let logoAdded = false;
            if (logoInput.files && logoInput.files[0]) {
                try {
                    const logoData = await getBase64(logoInput.files[0]);
                    doc.addImage(logoData, 'JPEG', 15, 8, 20, 20);
                    logoAdded = true;
                } catch (e) {
                }
            }
            
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(20);
            doc.setFont("helvetica", "bold");
            doc.text("LE NARJIS", 105, 20, { align: 'center' });
            
            doc.setTextColor(0, 0, 0);
            
            doc.setFontSize(16);
            doc.setTextColor(139, 0, 0);
            doc.setFont("helvetica", "bold");
            doc.text("BON DE RESERVATION", 105, 45, { align: 'center' });
            
            doc.setFontSize(12);
            doc.setTextColor(0, 0, 0);
            doc.setFont("helvetica", "normal");
            doc.text("Restaurant LE NARJIS • 19H30", 105, 55, { align: 'center' });
            
            doc.setDrawColor(212, 175, 55);
            doc.setLineWidth(0.8);
            doc.line(60, 60, 150, 60);
            
            doc.setFontSize(12);
            doc.setTextColor(139, 0, 0);
            doc.setFont("helvetica", "bold");
            doc.text("INFORMATIONS CLIENT", 20, 75);
            
            doc.setFont("helvetica", "normal");
            doc.setTextColor(0, 0, 0);
            
            doc.text(`Date: ${formatDate(date)}`, 20, 85);
            doc.text(`Nom/Name: ${name}`, 20, 95);
            doc.text(`N° de chambre: ${room}`, 20, 105);
            doc.text(`Nombre de personnes: ${pax}`, 20, 115);
            
            doc.setFont("helvetica", "bold");
            doc.setTextColor(139, 0, 0);
            doc.text("MENU COMMANDE", 20, 135);
            
            doc.setFont("helvetica", "normal");
            doc.setTextColor(0, 0, 0);
            let y = 145;
            if (menu1 > 0) {
                doc.text(`${menu1} x Menu Jardins d'Agadir`, 25, y);
                doc.text(`250 DH`, 180, y, { align: 'right' });
                y += 10;
            }
            if (menu2 > 0) {
                doc.text(`${menu2} x Menu Pecheur`, 25, y);
                doc.text(`250 DH`, 180, y, { align: 'right' });
                y += 10;
            }
            if (menu3 > 0) {
                doc.text(`${menu3} x Menu Berbere`, 25, y);
                doc.text(`180 DH`, 180, y, { align: 'right' });
                y += 10;
            }
            if (menu4 > 0) {
                doc.text(`${menu4} x Menu Narjis`, 25, y);
                doc.text(`150 DH`, 180, y, { align: 'right' });
                y += 10;
            }
            
            doc.setDrawColor(212, 175, 55);
            doc.setLineWidth(0.5);
            doc.line(20, y+5, 190, y+5);
            
            doc.setFont("helvetica", "bold");
            doc.text(`TOTAL:`, 25, y+15);
            doc.text(`${total} DH`, 180, y+15, { align: 'right' });
            
            doc.setFontSize(10);
            doc.setTextColor(100, 100, 100);
            doc.setFont("helvetica", "normal");
            doc.text("Les annulations sont acceptees jusqu'a 14h30 le jour prevu", 20, 280);
            doc.text("Cancellations are accepted until 2:30 PM on the scheduled day", 20, 285);
            
            if (!logoAdded) {
                doc.setFontSize(60);
                doc.setTextColor(230, 230, 230);
                doc.setFont("helvetica", "bold");
                doc.text("LE NARJIS", 105, 150, { angle: 45, align: 'center' });
            }
            
            doc.save(`Reservation_${name.replace(/\s+/g, '_')}_${formatDateForFilename(date)}.pdf`);
        }
    </script>
</body>
</html>
